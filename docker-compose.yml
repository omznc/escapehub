services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    container_name: escapehub-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      MSSQL_TCP_PORT: ${SQLSERVER_PORT}
    ports:
      - "${SQLSERVER_HOST_PORT}:${SQLSERVER_PORT}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost,$$MSSQL_TCP_PORT -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: escapehub-queue
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_NODE_PORT: ${RABBITMQ_PORT}
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: escapehub-mail
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:${SMTP_PORT}
    ports:
      - "${SMTP_PORT}:${SMTP_PORT}"
      - "${MAILPIT_UI_PORT}:8025"

  api:
    build:
      context: ./src
      dockerfile: EscapeHub.Api/Dockerfile
    container_name: escapehub-api
    env_file: .env
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - file_storage:/app/storage
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./src
      dockerfile: EscapeHub.Worker/Dockerfile
    container_name: escapehub-worker
    env_file: .env
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlserver_data:
  rabbitmq_data:
  file_storage:
